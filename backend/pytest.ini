[pytest]
asyncio_mode = auto
addopts = --cov=app --cov-report=term-missing --cov-report=html --cov-config=.coveragerc
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    benchmark: marks tests as performance benchmarks
    e2e: marks tests as end-to-end (requires real services)
    stress: marks tests as stress tests (high resource usage)
