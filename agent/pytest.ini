[pytest]
asyncio_mode = auto
testpaths = tests
addopts = --cov=. --cov-report=term-missing --cov-report=html --cov-config=.coveragerc
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    benchmark: marks tests as performance benchmarks
    e2e: marks tests as end-to-end (requires real LLM)
    real_llm: marks tests that require real LLM API keys
    kg_data: marks tests that require built KG index
    stress: marks tests as stress tests
